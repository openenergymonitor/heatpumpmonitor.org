<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HeatpumpMonitor.org - Maintenance</title>
        <meta name="theme-color" content="#44b3e2">
        <link rel="icon" type="image/png" sizes="32x32" href="{{path}}theme/img/logo/favicon-32x32.png">

        <style>

        /* Themed to match the site: white page, #44b3e2 accent and the pale
           #e3f7ff panel used by the table headers in theme/style.css. The css
           is inline rather than a link to theme/style.css, which is 2000 lines
           of site chrome this page has no use for. The logo and favicon are
           the only external references: the rewrite in .htaccess sends only
           non existent paths to index.php, so the web server keeps serving
           theme/ directly while the site is refusing requests. */

        body {
            font-family: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #444;
            margin: 0px;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message {
            max-width: 640px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
        }

        .logo {
            width: 96px;
            height: 96px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 42px;
            line-height: 1.1;
            color: #222;
            margin: 0px 0px 30px 0px;
        }

        .title span {
            color: #44b3e2;
        }

        .subtitle {
            font-size: 18px;
            line-height: 22px;
            color: #555;
            margin-bottom: 15px;
        }

        .countdown-container {
            background-color: #e3f7ff;
            border-radius: 4px;
            padding: 20px;
            margin: 30px 0px;
        }

        .countdown-text {
            font-size: 18px;
            line-height: 25px;
            color: #222;
        }

        a {
            color: #44b3e2;
            text-decoration: none;
        }

        a:hover {
            color: #222;
            text-decoration: none;
        }

        #time_online {
            color: #44b3e2;
            font-weight: bold;
            font-size: 20px;
        }

        /* Flex row so the dot lines up with the centre of the text rather
           than the baseline, which sits it too low against 22px copy. */
        .status-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-indicator {
            flex: none;
            width: 10px;
            height: 10px;
            background-color: #44b3e2;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .forum-link {
            font-size: 18px;
            margin: 20px 0px;
        }

        .footer-note {
            font-size: 16px;
            color: #888;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        @media (max-width: 640px) {
            .title { font-size: 30px; }
        }

        </style>
    </head>
    <body>
        <div class="message">
            <img class="logo" src="{{path}}theme/img/logo/android-chrome-192x192.png" alt="HeatpumpMonitor.org">

            <h1 class="title">Heatpump<span>Monitor</span>.org</h1>

            <div class="subtitle">Maintenance in progress</div>

            <div class="subtitle status-line">
                <span class="status-indicator"></span>
                <span>{{message}}</span>
            </div>

            <div class="countdown-container">
                <div class="countdown-text">
                    Expected back online in <span id="time_online">1 hour.</span>
                </div>
            </div>

            <div class="subtitle">
                For updates please see the OpenEnergyMonitor forum at:
            </div>

            <div class="forum-link">
                <a href="https://community.openenergymonitor.org/">community.openenergymonitor.org</a>
            </div>

            <div class="footer-note">
                Thank you for your patience
            </div>
        </div>

        <script>
            // Expected time back online, substituted from the "until" field of
            // the maintenance entry in settings.php (unix seconds). Falls back
            // to one hour from now if the page is served without substitution.
            var until = parseInt("{{until}}", 10);
            var expectedOnline = until > 0 ? new Date(until * 1000)
                                           : new Date(new Date().getTime() + 3600000);

            function updateCountdown() {
                var now = new Date();
                var timeDiff = expectedOnline.getTime() - now.getTime();

                var timeOnlineElement = document.getElementById('time_online');

                if (timeDiff <= 0) {
                    // Time has passed, show "back online" message
                    timeOnlineElement.innerHTML = 'now, please refresh the page';
                    timeOnlineElement.style.color = '#5cb85c';
                    return;
                }

                // Calculate hours and minutes remaining
                var hours = Math.floor(timeDiff / (1000 * 60 * 60));
                var minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));

                // Format the time string
                var timeString = "";
                if (hours > 0) {
                    timeString += hours + " hour" + (hours !== 1 ? "s" : "");
                    if (minutes > 0) {
                        timeString += " and " + minutes + " minute" + (minutes !== 1 ? "s" : "");
                    }
                } else if (minutes > 0) {
                    timeString += minutes + " minute" + (minutes !== 1 ? "s" : "");
                } else {
                    timeString = "less than a minute";
                }

                timeString += ".";

                // Update the countdown span
                timeOnlineElement.innerHTML = timeString;
            }

            // Update immediately when page loads
            updateCountdown();

            // Update every minute
            setInterval(updateCountdown, 60000);
        </script>
    </body>
</html>
